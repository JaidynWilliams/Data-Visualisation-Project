<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>OECD Health Visualisation</title>

    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <div class="page">

        <header>
            <h1>OECD Health Visualisation</h1>
            <p>Mortality and health outcomes across OECD countries</p>
        </header>

        <main class="visualisation-layout">
    
            <section class="chart-card">

                <h2>Chart 1</h2>
                <div id="chart-1" class="chart"></div>

                <div class="controls">

                    <div class="control">
                        <label for="chart-1-country-select">Country</label>
                        <select id="chart-1-country-select"></select>
                    </div>
                    <div class="control">
                        <label for="chart-1-sex-select">Sex</label>
                        <select id="chart-1-sex-select"></select>
                    </div>
                    <div class="control">
                        <label for="chart-1-method-select">Method</label>
                        <select id="chart-1-method-select"></select>
                    </div>
                </div>
                <div class="slider-container">
                    <label for="chart-1-year-slider">Year</label>
                    <input id="chart-1-year-slider" type="range">
                    <span id="chart-1-year-value"></span>
                </div>

            </section>
            

            <section class="chart-card">
                <h2>Chart 2: Country trend over time</h2>

                <div id="chart-2" class="chart"></div>

                <div class="controls">
                    <div class="control">
                        <label for="chart-2-country-select">Country</label>
                        <select id="chart-2-country-select"></select>
                    </div>

                    <div class="control">
                        <label for="chart-2-compare-select">Compare with</label>
                        <select id="chart-2-compare-select"></select>
                    </div>

                    <div class="control">
                        <label for="chart-2-sex-select">Sex</label>
                        <select id="chart-2-sex-select"></select>
                    </div>

                    <div class="control">
                        <label for="chart-2-method-select">Method</label>
                        <select id="chart-2-method-select"></select>
                    </div>

                    <div class="control">
                        <label for="chart-2-measure-select">Indicator</label>
                        <select id="chart-2-measure-select"></select>
                    </div>
                </div>

                <div class="slider-container">
                    <label for="chart-2-year-slider">Year marker</label>
                    <input id="chart-2-year-slider" type="range">
                    <span id="chart-2-year-value"></span>
                </div>
            </section>

            
            <section class="chart-card full-width">
                <h2>Chart 4: Mortality composition by country</h2>

                <div id="chart-4" class="chart"></div>

                <div class="controls">
                    <div class="control">
                        <label for="chart-4-sex-select">Sex</label>
                        <select id="chart-4-sex-select"></select>
                    </div>

                    <div class="control">
                        <label for="chart-4-method-select">Method</label>
                        <select id="chart-4-method-select"></select>
                    </div>
                </div>

                <div class="slider-container">
                    <label for="chart-4-year-slider">Year</label>
                    <input id="chart-4-year-slider" type="range">
                    <span id="chart-4-year-value"></span>
                </div>
            </section>

            
            <section class="chart-card">

                <h2>Chart 5: Mortality causes over time</h2>

                <div id="chart-5" class="chart"></div>

                <div class="controls">

                    <div class="control">
                        <label for="chart-5-country-select">Country</label>
                        <select id="chart-5-country-select"></select>
                    </div>

                    <div class="control">
                        <label for="chart-5-sex-select">Sex</label>
                        <select id="chart-5-sex-select"></select>
                    </div>

                    <div class="control">
                        <label for="chart-5-method-select">Method</label>
                        <select id="chart-5-method-select"></select>
                    </div>

                </div>

                <div class="slider-container">
                    <label for="chart-5-year-slider">Year</label>
                    <input id="chart-5-year-slider" type="range">
                    <span id="chart-5-year-value"></span>
                </div>

            </section>

            <section class="chart-card">


        <section class="chart-card">

            <h2>Chart 6: Countries ranked</h2>

            <div id="chart-6" class="chart"></div>

            <div class="controls">

                <div class="control">
                    <label for="chart-6-country-select">Highlight country</label>
                    <select id="chart-6-country-select"></select>
                </div>

                <div class="control">
                    <label for="chart-6-compare-select">Compare with</label>
                    <select id="chart-6-compare-select"></select>
                </div>

                <div class="control">
                    <label for="chart-6-sex-select">Sex</label>
                    <select id="chart-6-sex-select"></select>
                </div>

                <div class="control">
                    <label for="chart-6-method-select">Method</label>
                    <select id="chart-6-method-select"></select>
                </div>

                <div class="control">
                    <label for="chart-6-measure-select">Indicator</label>
                    <select id="chart-6-measure-select"></select>
                </div>

            </div>

            <div class="slider-container">
                <label for="chart-6-year-slider">Year</label>
                <input id="chart-6-year-slider" type="range">
                <span id="chart-6-year-value"></span>
            </div>

        </section>


        </main>


        <footer>
            <div class="attribution">
                Data source: OECD Health Statistics, 2015-2024
            </div>
        </footer>

    </div>


    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
    <script type="module" src="./main.js"></script>

</body>
</html>
