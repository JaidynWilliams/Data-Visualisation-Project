<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>OECD Health Visualisation</title>

    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <div class="page">

        <header>
            <h1>OECD Health Visualisation</h1>
            <p>Mortality and health outcomes across OECD countries</p>
        </header>

        <main class="visualisation-layout">

            <section class="chart-section">
                <div id="chart"></div>

                <div class="slider-container">
                <input
                    id="year-slider"
                    type="range"
                >
                <span id="year-value"></span>
                </div>
            </section>


            <aside class="controls">

                <div class="control">
                    <label for="country-select">Country</label>
                    <select id="country-select"></select>
                </div>

                <div class="control">
                    <label for="sex-select">Sex</label>
                    <select id="sex-select"></select>
                </div>

                <div class="control">
                    <label for="method-select">Method</label>
                    <select id="method-select"></select>
                </div>

            </aside>

        </main>


        <footer>
            <div class="attribution">
                Data source: OECD Health Statistics, 2015-2024
            </div>
        </footer>

    </div>


    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script> <!-- ?-->
    <script type="module" src="./main.js"></script>

</body>
</html>
